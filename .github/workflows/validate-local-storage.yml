name: Validate local storage deployment

on:
  push:
    branches: [ develop ]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/newspaper_screenshot_hub_test
      RAILS_ENV: test

    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Prepare database
        run: bin/rails db:prepare
      - name: Validate application
        run: |
          bin/rails zeitwerk:check
          bin/rails test
          bin/rubocop
          python3 -m py_compile script/capture_page.py
          ruby -e 'require "yaml"; YAML.load_file("render.yaml", aliases: true); YAML.load_file("config/recurring.yml", aliases: true)'
      - name: Validate production container
        run: docker build --tag newspaper-screenshot-hub:local-storage .
