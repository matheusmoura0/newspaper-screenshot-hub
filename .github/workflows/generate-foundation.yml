name: Generate MVP foundation

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths: [.github/workflows/generate-foundation.yml]

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: newspaper_screenshot_hub_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/newspaper_screenshot_hub_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Generate authentication and domain
        run: |
          bundle config set frozen false
          bin/rails generate authentication
          bin/rails generate controller Dashboard index
          sed -i '/resource :session/a\  root "dashboard#index"' config/routes.rb
          sed -i 's/assert_response :success/assert_redirected_to new_session_url/' test/controllers/dashboard_controller_test.rb
          bin/rails active_storage:install
          bin/rails generate migration AddAccessFieldsToUsers name:string role:integer active:boolean invited_at:datetime accepted_invitation_at:datetime last_sign_in_at:datetime
          bin/rails generate model Newspaper name:string slug:string homepage_url:string category:string country:string time_zone:string capture_time:time desktop_enabled:boolean mobile_enabled:boolean active:boolean capture_options:jsonb
          bin/rails generate model CaptureRun scheduled_for:date started_at:datetime finished_at:datetime status:integer expected_count:integer completed_count:integer failed_count:integer error_summary:text
          bin/rails generate model Screenshot newspaper:references capture_run:references captured_on:date captured_at:datetime viewport:integer status:integer attempts:integer duration_ms:integer width:integer height:integer source_url:string error_code:string error_message:text metadata:jsonb
          bin/rails generate model ActivityLog user:references action:string auditable_type:string auditable_id:bigint metadata:jsonb
      - name: Validate and check tracked files
        run: |
          bin/rails db:prepare
          bin/rails test
          test -z "$(git status --short --untracked-files=all | grep 'vendor/bundle' || true)"
      - name: Commit foundation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "feat: generate authentication and capture domain"
          git push origin develop
      - name: Remove generator workflow
        run: |
          git rm .github/workflows/generate-foundation.yml
          git commit -m "chore: remove one-time foundation workflow"
          git push origin develop
