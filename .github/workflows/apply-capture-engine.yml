name: Validate capture engine v2

on:
  push:
    branches: [develop]
    paths: [.github/workflows/apply-capture-engine.yml]

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: newspaper_screenshot_hub_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/newspaper_screenshot_hub_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Apply capture engine
        run: git apply .github/capture-engine.patch
      - name: Update dependencies
        run: |
          bundle config set frozen false
          bundle install
      - name: Validate application
        run: |
          bin/rails db:prepare
          bin/rails zeitwerk:check
          bin/rails test
          bin/rubocop --format github
          python3 -m py_compile script/capture_page.py
          ruby -e 'require "yaml"; YAML.safe_load_file("render.yaml", aliases: true)'
      - name: Validate production container
        run: docker build --tag newspaper-screenshot-hub:test .
      - name: Commit capture engine
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/capture-engine.patch .github/workflows/apply-capture-engine.yml
          git add .
          git commit -m "feat: add Playwright capture engine and Render blueprint"
          git push origin develop
