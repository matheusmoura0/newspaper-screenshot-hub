name: Apply and validate MVP interface

on:
  push:
    branches: [develop]
    paths: [.github/workflows/apply-mvp-interface.yml]

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: newspaper_screenshot_hub_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/newspaper_screenshot_hub_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Apply implementation
        run: git apply .github/mvp-interface.patch
      - name: Validate application
        run: |
          bin/rails db:prepare
          bin/rails zeitwerk:check
          bin/rails test
          bin/rubocop --format github
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/mvp-interface.patch .github/workflows/apply-mvp-interface.yml
          git add .
          git commit -m "feat: add admin, invitations and screenshot archive"
          git push origin develop
