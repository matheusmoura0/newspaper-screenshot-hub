name: Bootstrap Rails application

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/bootstrap.yml

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install Rails
        run: gem install rails --version "~> 8.1" --no-document

      - name: Generate Rails application
        run: |
          rails new /tmp/newspaper-screenshot-hub \
            --database=postgresql \
            --skip-action-mailbox \
            --skip-action-text
          rsync -a \
            --exclude .git/ \
            --exclude README.md \
            --exclude .github/ \
            /tmp/newspaper-screenshot-hub/ ./

      - name: Configure and verify repository
        run: |
          sed -i 's/^ruby .*/ruby "3.3.6"/' Gemfile
          bundle lock --add-platform x86_64-linux
          test -f .gitignore
          test -z "$(git ls-files --others --exclude-standard config/master.key tmp/cache log/development.log)"

      - name: Commit generated application
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: bootstrap Rails 8.1 application"
          git push origin develop

      - name: Remove bootstrap workflow
        run: |
          git rm .github/workflows/bootstrap.yml
          git commit -m "chore: remove one-time bootstrap workflow"
          git push origin develop
